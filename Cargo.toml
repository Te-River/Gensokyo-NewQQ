# Gensokyo-NewQQ Rust workspace
# 设计依据：rust-rewrite/01-architect-design.md §1（布局）、§8（M0）、§9（安全与供应链）

[workspace]
resolver = "3"
members = [
    "crates/gensokyo-core",
    "crates/gensokyo-config",
    "crates/gensokyo-protocol",
    "crates/gensokyo-qq",
    "crates/gensokyo-storage",
    "crates/gensokyo-media",
    "crates/gensokyo-actions",
    "crates/gensokyo-runtime",
    "crates/gensokyo-webui",
    "crates/gensokyo-bin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# 内部 crate（依赖方向只能向下：bin → runtime → actions → 能力 crate → config → core）
# 带 version 而非裸 path：cargo-deny 的 bans/wildcards 会把"仅 path 无版本"判为 wildcard 依赖
gensokyo-core = { path = "crates/gensokyo-core", version = "0.1.0" }
gensokyo-config = { path = "crates/gensokyo-config", version = "0.1.0" }
gensokyo-protocol = { path = "crates/gensokyo-protocol", version = "0.1.0" }
gensokyo-qq = { path = "crates/gensokyo-qq", version = "0.1.0" }
gensokyo-storage = { path = "crates/gensokyo-storage", version = "0.1.0" }
gensokyo-media = { path = "crates/gensokyo-media", version = "0.1.0" }
gensokyo-actions = { path = "crates/gensokyo-actions", version = "0.1.0" }
gensokyo-runtime = { path = "crates/gensokyo-runtime", version = "0.1.0" }
gensokyo-webui = { path = "crates/gensokyo-webui", version = "0.1.0" }

# 异步运行时 / 网络
tokio = "1.54.1"
axum = "0.8.9"
tokio-tungstenite = "0.30.0"
tungstenite = "0.30.0"
reqwest = "0.13.5"

# gRPC（M1f）：IDMapService，proto 与 Go 共享 `proto/idmap.proto`（service 全名/字段号不可变）。
# tonic 0.14 起 prost 代码生成与运行时拆到 tonic-prost(-build)，tonic 本体只管通用 gRPC 实现；
# 默认特性含 codegen/router/transport/channel/server，不含 TLS provider，因此不引入 ring / C 工具链。
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14.4"
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
prost-build = "0.14.4"
# 构建机不预装 protoc：用随 crate 分发的预编译二进制（不是 C 工具链依赖，
# 也避免 edition 2024 下 unsafe { env::set_var("PROTOC", ..) } 撞上 workspace 的 forbid(unsafe_code)）
protoc-bin-vendored = "3.3.0"

# WebUI（M3）：编译期嵌入 `webui/dist` 静态资源 + 按扩展名推导 Content-Type
rust-embed = "8.13.0"
mime_guess = "2.0.5"

# 序列化 / 配置
serde = { version = "1.0.229", features = ["derive"] }
# OneBot 协议层：事件/消息段/action 参数都是 JSON，`#[serde(flatten)] extra` 也需要 Value
serde_json = "1.0.150"
# 主选 YAML 库：serde_norway（serde_yaml 的维护分支，RustSec 推荐）
# 2026-10-22 裁决：serde_yml 0.0.13 因 RUSTSEC-2025-0068（unsound/unmaintained）弃用
serde_norway = "0.9.42"
saphyr = "0.2.2"

# 存储
redb = "4.4.0"
# 行号派生：Go `idmap.GenerateRowID` 用 MD5，虚拟行号迁移/对拍必须逐位一致
# 关闭默认特性：只需要摘要核心，不需要 oid（const-oid）与 alloc
md-5 = { version = "0.11.0", default-features = false }

# 可观测性 / 错误
tracing = "0.1.44"
thiserror = "2.0.21"
anyhow = "1.0.104"

# CLI / 工具
clap = { version = "4.6.7", features = ["derive"] }

# 媒体 / 通用工具
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
bytes = "1.12.1"
futures = "0.3.34"
parking_lot = "0.13.0"
dashmap = "6.2.1"
uuid = { version = "1.28.0", features = ["v4"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }

# TLS 安全下限（RustSec-2026-0382/0383 / CVE-2026-111943）
# 低于下列版本的 rustls/webpki 禁止进入依赖图；`cargo xtask check-tls-floors` + CI 会再断言一次。
# provider（ring / aws-lc-rs）显式不选：它决定是否需要 C 工具链与平台矩阵，留到 M1 定。
rustls = { version = "0.23.46", default-features = false, features = ["logging", "std", "tls12"] }
webpki-root-certs = "1.0.10"
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
unimplemented = "deny"
todo = "warn"

# 发布构建：LTO + 单 codegen unit 换运行期性能，strip 掉符号缩小产物。
# 刻意不设 panic = "abort"：runtime 的 handler 隔离依赖 catch_unwind。
# 方法论、复跑方式与当前基线数字见 docs/rust-perf.md。
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"

# bench 与 release 同档：基准必须测发布口径的优化等级，否则数字没有意义。
[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
