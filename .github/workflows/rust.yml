name: Rust

on:
  push:
    branches: [Refactor, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain 鏃?1.99.1 tag锛坄git ls-remote --tags` 涓虹┖锛夛紝ref 鍙兘鍙?@master锛?      # 鐪熸鐨勭紪璇戝櫒鐗堟湰鐢?`toolchain` 杈撳叆閽夋锛屼笌 rust-toolchain.toml 涓€鑷淬€?      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - name: Ensure webui/dist placeholder
        shell: bash
        run: mkdir -p webui/dist && printf '<!doctype html><title>Gensokyo WebUI</title><h1>Gensokyo WebUI</h1>' > webui/dist/index.html
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Ensure webui/dist placeholder
        shell: bash
        run: mkdir -p webui/dist && printf '<!doctype html><title>Gensokyo WebUI</title><h1>Gensokyo WebUI</h1>' > webui/dist/index.html
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  tls-floors:
    name: tls-floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      # `cargo xtask` 浼氭妸灏鹃殢鍙傛暟杞彂缁?xtask 浜岃繘鍒讹紝`--locked` 蹇呴』钀藉湪 cargo run 涓婏紝
      # 鍚﹀垯 cargo 鍙兘鍦ㄦ牎楠屽墠闈欓粯鏀瑰啓 Cargo.lock銆?      - run: cargo run --locked --package xtask -- check-tls-floors
