name: Rust

on:
  push:
    branches: [Refactor, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dtolnay/rust-toolchain 无 1.99.1 tag（`git ls-remote --tags` 为空），ref 只能取 @master；
      # 真正的编译器版本由 `toolchain` 输入钉死，与 rust-toolchain.toml 一致。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: clippy
      - name: Ensure webui/dist placeholder
        shell: bash
        run: mkdir -p webui/dist && printf '<!doctype html><title>Gensokyo</title>' > webui/dist/index.html
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Ensure webui/dist placeholder
        shell: bash
        run: mkdir -p webui/dist && printf '<!doctype html><title>Gensokyo</title>' > webui/dist/index.html
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  tls-floors:
    name: tls-floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
      # `cargo xtask` 会把尾随参数转发给 xtask 二进制，`--locked` 必须落在 cargo run 上，
      # 否则 cargo 可能在校验前静默改写 Cargo.lock。
      - run: cargo run --locked --package xtask -- check-tls-floors
