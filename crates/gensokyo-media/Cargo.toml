[package]
name = "gensokyo-media"
description = "下载上传、压缩、图床、silk、QR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 生产传输：只启用 rustls 骨架（`rustls-no-provider`），不拉 aws-lc-rs/native-tls。
# provider（ring / aws-lc-rs）由二进制侧选择并经 `HttpTransport::with_provider` 注入，
# 与 gensokyo-qq 的 `ReqwestTransport` 同一套 seam（M0 设计 §9.1 的 provider 留白）。
reqwest = { workspace = true, default-features = false, features = [
    "http2",
    "rustls-no-provider",
    "system-proxy",
] }
rustls.workspace = true
webpki-root-certs.workspace = true
thiserror.workspace = true
# fs：下载落盘；time：总超时；io-util：AsyncWriteExt
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
# base64：data URI / base64:// 编解码（Engine 配置见 data_uri.rs）
base64.workspace = true
# tracing：临时文件写失败且清理失败时的告警（fetch.rs 的 write_temp）
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
