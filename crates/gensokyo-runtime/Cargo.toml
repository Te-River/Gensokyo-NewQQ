[package]
name = "gensokyo-runtime"
description = "入站转换、四种连接、dispatch、队列与限速、优雅关闭"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gensokyo-core.workspace = true
gensokyo-config.workspace = true
gensokyo-protocol.workspace = true
gensokyo-storage.workspace = true
gensokyo-qq.workspace = true
# 正向 WS / HTTP API 服务端；`ws` 提供 WebSocket 升级
axum = { workspace = true, features = ["ws"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
# WS 测试客户端（SinkExt / StreamExt）
futures.workspace = true
tempfile = "3.27.0"
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
