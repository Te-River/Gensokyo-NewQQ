[package]
name = "gensokyo-runtime"
description = "入站转换、四种连接、dispatch、队列与限速、优雅关闭"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gensokyo-core.workspace = true
gensokyo-config.workspace = true
gensokyo-protocol.workspace = true
gensokyo-storage.workspace = true
gensokyo-qq.workspace = true
# 出站 action 全集（41 个 handler）与 deferred 计划类型（`SendRequest` / `MessageOut`）
gensokyo-actions.workspace = true
# deferred 媒体链路：`Fetcher` 取字节（URL / base64 / 本地），再交给 `QqApi` 上传
gensokyo-media.workspace = true
# WebUI 静态页与 `/api` 登录路由（M3）；`disable_webui=false` 时挂进 listener
gensokyo-webui.workspace = true
# 正向 WS / HTTP API 服务端；`ws` 提供 WebSocket 升级，`multipart` 解析 `/uploadpic` 的
# `multipart/form-data`（Go `PostForm` 同时支持 urlencoded 与 multipart）
axum = { workspace = true, features = ["ws", "multipart"] }
# `/uploadpic` 的 `channel_temp/<md5>.<ext>` 命名（Go `getFileMd5`）
md-5.workspace = true
# `/uploadpic` 的 `base64Image` 字段解码（Go `base64.StdEncoding`）
base64.workspace = true
# webhook ed25519 验签（ring 已随 TLS 栈进树，这里只是直连）
ring.workspace = true
# lotus 短链 mint（`url_pipeline::LotusMint`）；workspace 声明 default-features=false，
# 本 crate 只用无 feature 门槛的核心 API（手写 urlencoded body、text() + serde_json 解析），
# 不开 form/json feature、不加新 crate（reqwest 已随 media/qq 在依赖图与 Cargo.lock）
reqwest.workspace = true
# LotusMint::try_new 的 provider 预检直读 CryptoProvider::get_default；workspace 定义
# 已是 no-provider（default-features=false，无 ring/aws-lc-rs），不引入新 crate
#（经 reqwest 已在编译图），与 gensokyo-storage 同款
rustls.workspace = true
# idmap gRPC 装配（`!lotus && lotus_grpc` 起服务端，`lotus` 时挂客户端桥）：服务端与
# 17 个 RPC 实现都在 gensokyo-storage 的 `idmap::grpc`，这里只需要 tonic 的
# `transport::Server` / `Endpoint` 装配与关闭信号
tonic.workspace = true
# 反向 WS 客户端：`SinkExt` / `StreamExt` 拆读写两半
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time", "io-util"] }
# 反向 WS 客户端 + QQ 网关客户端；网关走 wss://，TLS feature 只能由成员加（workspace 只声明版本）
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true

[dev-dependencies]
# WS 测试客户端（SinkExt / StreamExt）
futures.workspace = true
# webhook 用例要按 Go 的 seed 规则自己派生密钥并签名
ring.workspace = true
# HTTP 回退桥用例：测试进程装 ring CryptoProvider（生产由二进制 startup 装）
rustls = { workspace = true, features = ["ring"] }
tempfile = "3.27.0"
# 图片压缩接线用例要生成 JPEG 样本（工作区已因 gensokyo-media 锁定 image）
image.workspace = true
# 路由级用例：in-process 调用 `Router`（axum 自身只提供 `serve`，`oneshot` 在 tower）
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
