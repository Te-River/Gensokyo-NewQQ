[package]
name = "gensokyo-runtime"
description = "入站转换、四种连接、dispatch、队列与限速、优雅关闭"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gensokyo-core.workspace = true
gensokyo-config.workspace = true
gensokyo-protocol.workspace = true
gensokyo-storage.workspace = true
gensokyo-qq.workspace = true
# 出站 action 全集（41 个 handler）与 deferred 计划类型（`SendRequest` / `MessageOut`）
gensokyo-actions.workspace = true
# deferred 媒体链路：`Fetcher` 取字节（URL / base64 / 本地），再交给 `QqApi` 上传
gensokyo-media.workspace = true
# WebUI 静态页与 `/api` 登录路由（M3）；`disable_webui=false` 时挂进 listener
gensokyo-webui.workspace = true
# 正向 WS / HTTP API 服务端；`ws` 提供 WebSocket 升级，`multipart` 解析 `/uploadpic` 的
# `multipart/form-data`（Go `PostForm` 同时支持 urlencoded 与 multipart）
axum = { workspace = true, features = ["ws", "multipart"] }
# `/uploadpic` 的 `channel_temp/<md5>.<ext>` 命名（Go `getFileMd5`）
md-5.workspace = true
# `/uploadpic` 的 `base64Image` 字段解码（Go `base64.StdEncoding`）
base64.workspace = true
# webhook ed25519 验签（ring 已随 TLS 栈进树，这里只是直连）
ring.workspace = true
# 反向 WS 客户端：`SinkExt` / `StreamExt` 拆读写两半
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time", "io-util"] }
# 反向 WS 客户端 + QQ 网关客户端；网关走 wss://，TLS feature 只能由成员加（workspace 只声明版本）
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tracing.workspace = true

[dev-dependencies]
# WS 测试客户端（SinkExt / StreamExt）
futures.workspace = true
# webhook 用例要按 Go 的 seed 规则自己派生密钥并签名
ring.workspace = true
tempfile = "3.27.0"
# 路由级用例：in-process 调用 `Router`（axum 自身只提供 `serve`，`oneshot` 在 tower）
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
