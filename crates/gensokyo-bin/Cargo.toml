[package]
name = "gensokyo-bin"
description = "gensokyo 可执行入口"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gensokyo"
path = "src/main.rs"

[dependencies]
gensokyo-actions.workspace = true
gensokyo-config.workspace = true
gensokyo-core.workspace = true
gensokyo-qq.workspace = true
gensokyo-runtime.workspace = true
# idmap 存储（`ActionContext` 的虚拟号反查；启动装配在 `gensokyo_runtime::boot::attach_idmap`）。
gensokyo-storage.workspace = true
clap.workspace = true
thiserror.workspace = true
# TLS provider：`gensokyo-qq` / `gensokyo-media` 只带 rustls 骨架（`rustls-no-provider`），
# provider 由二进制注入。ring 需要 C 工具链（CI ubuntu 的 gcc / 本机 mingw gcc）。
rustls = { workspace = true, features = ["ring"] }
# 进程级异步运行时 + Ctrl-C 信号；`enable_all` 需要 net/time 驱动
tokio = { workspace = true, features = [
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
# 全局分配器（P33）：`#[global_allocator]` 落在 `src/main.rs`，只有最终二进制会装；
# 库 crate 与 xtask bench 口径不感知它。
mimalloc.workspace = true
# 日志时间戳（RFC3339，以及 WebUI 日志流要用的本地 12 小时制）；
# `local-offset` 让 `OffsetDateTime::now_local` 可用，取不到时退回 UTC
time = { workspace = true, features = ["local-offset"] }
tracing.workspace = true
# WebUI 日志中枢（`/api/logs` 环形缓冲 + 广播）：采集层往里投递，webui crate 负责推送
gensokyo-webui.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }

[lints]
workspace = true
