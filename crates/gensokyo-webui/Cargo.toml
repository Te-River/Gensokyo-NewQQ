[package]
name = "gensokyo-webui"
description = "内嵌前端资源与管理 API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gensokyo-config.workspace = true
# `/api/status` 的 os/arch/executable/local_ip：`gensokyo_core::sys::SystemInfo`
gensokyo-core.workspace = true
# `ws`：日志流路由（`/api/logs`）用 `WebSocketUpgrade`（Go `mylog.WsHandler`）
axum = { workspace = true, features = ["ws"] }
# `sync`：日志广播（`broadcast`）；`time`：WS 心跳间隔
tokio = { workspace = true, features = ["sync", "time"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# 编译期嵌入 `webui/dist`（前端构建产物）并按扩展名推 Content-Type
rust-embed.workspace = true
mime_guess.workspace = true
# 会话落盘（`cookie.redb`）：redb 已是 workspace 依赖（gensokyo-storage 同版本）
redb.workspace = true

[dev-dependencies]
# 直接用 `Router` 发请求（`tower::ServiceExt::oneshot`），不监听端口、不碰外网
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
tower = { version = "0.5.3", features = ["util"] }
# 日志 WS 用例要真实握手：loopback 起 listener，用 tungstenite 客户端连
tokio-tungstenite.workspace = true
futures.workspace = true

[lints]
workspace = true
