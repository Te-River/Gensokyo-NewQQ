[package]
name = "gensokyo-storage"
description = "idmap、echo、cookie、bbolt 导入、gRPC 服务"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# 四能力之一：idmap 的 IDMapService gRPC（tonic）。关闭后 `idmap::grpc` 与
# `idmap::remote`（远端桥）不编译，`idmap_remote_mode` 仍留在 `idmap` 里，
# runtime 据此把 `lotus_grpc=true` 降级成 warn + 本地。
default = ["grpc"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]

[dependencies]
gensokyo-core.workspace = true
redb.workspace = true
md-5.workspace = true
# JSONL 导入器：逐行 serde_json 解析（workspace 已有，协议层在用）
serde.workspace = true
serde_json.workspace = true
# `end` 行的整文件校验：SHA-2 家族摘要，已在依赖图内（rust-embed-utils → sha2 0.11）
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
# 迁移备份名的时间戳（Go `time.Now().Format("20060102-150405")`）；已在 workspace 依赖图
time = { workspace = true, features = ["local-offset"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
# lotus gRPC 客户端 RemoteBridge 专职桥线程（P55-P1）：独立 current_thread runtime + 超时
tokio = { workspace = true, features = ["rt", "net", "time"] }
# lotus HTTP 回退桥（P55-P3）：blocking 客户端在专职桥线程构造。TLS 沿用仓库惯例
# rustls-no-provider，provider 由二进制侧进程级安装（gensokyo-bin startup 装 ring）；
# 未安装 provider 时桥 spawn 预检后按建连失败同口径返回 Err（release panic=abort
# 不允许桥线程 panic）。
reqwest = { workspace = true, features = [
    "blocking",
    "http2",
    "rustls-no-provider",
    "system-proxy",
] }
# provider 预检直读 CryptoProvider::get_default；workspace 定义已是 no-provider
#（default-features=false，无 ring/aws-lc-rs），不引入新 crate（经 reqwest 已在编译图）
rustls.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
# 测试进程装 ring CryptoProvider（spawn_test_bridge 幂等安装）；生产由二进制 startup 装
rustls = { workspace = true, features = ["ring"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["net"] }

[lints]
workspace = true
