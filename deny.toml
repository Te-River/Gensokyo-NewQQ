# cargo-deny 配置（design §9.1 依赖准入）

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
# 全局白名单按 design §9.1；仅对 Mozilla CA 根证书数据包开单包例外（CDLA-Permissive-2.0 是
# 该数据集的唯一许可，属宽松许可、无 copyleft，不是 advisory 豁免）。
exceptions = [
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# TLS 全走 rustls：OpenSSL 及其 -sys 绑定一律拒绝
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
